[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
description = "Core daemon for the AI Agent system — event loop, session management, routing, and access control."

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
[dependencies]

# --- gRPC / Protobuf (P2: Cognition Engine client) ---
tonic          = { version = "0.12", features = ["transport", "tls"] }
tonic-health   = "0.12"
prost          = "0.13"
prost-types    = "0.13"

# --- Async runtime ---
tokio          = { version = "1", features = ["full"] }
tokio-stream   = "0.1"
futures        = "0.3"

# --- HTTP / WebSocket server (P6) ---
axum           = { version = "0.7", features = ["ws", "macros"] }
tower          = { version = "0.4", features = ["full"] }
tower-http     = { version = "0.5", features = ["cors", "trace"] }
governor       = { version = "0.7", features = ["dashmap"] }

# --- Wasm sandbox (P4) ---
wasmtime       = { version = "28", features = ["cranelift", "cache"] }
wasmtime-wasi  = "28"

# --- Qdrant (P5) ---
qdrant-client  = "1"

# --- BGE embeddings in-process (P5) ---
fastembed      = "4"

# --- Serialization ---
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# --- TOML frontmatter parsing for tool.md (P4) ---
toml           = "0.8"

# --- Observability (P9) ---
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter", "json", "chrono"] }
opentelemetry              = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry_sdk          = { version = "0.27", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp         = { version = "0.27", features = ["tonic", "trace", "metrics"] }
tracing-opentelemetry      = "0.28"
opentelemetry-semantic-conventions = "0.27"

# --- Error handling ---
thiserror      = "2"
anyhow         = "1"

# --- Utilities ---
uuid           = { version = "1", features = ["v4", "serde"] }
chrono         = { version = "0.4", features = ["serde"] }
regex          = "1"
once_cell      = "1"
rand           = "0.9"

# --- Config / Environment ---
config         = { version = "0.14", features = ["toml"] }
dotenvy        = "0.15"

# ---------------------------------------------------------------------------
# Build dependencies (proto codegen)
# ---------------------------------------------------------------------------
[build-dependencies]
tonic-build         = "0.12"
protoc-bin-vendored = "3"

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
[dev-dependencies]
tokio-test     = "0.4"
tempfile       = "3"
wiremock       = "0.6"
