[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognition-engine"
version = "0.1.0"
description = "Cognition Engine: prompt formatting, token counting, output parsing, and LLM client for the AI Agent."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "litellm>=1.56.0",
    "tiktoken>=0.9.0",
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "grpcio-reflection>=1.70.0",
    "grpcio-health-checking>=1.70.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.0",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
cognition-engine = "cognition_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cognition_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
